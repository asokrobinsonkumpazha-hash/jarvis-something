services:
  - type: web
    name: jarvis-router
    runtime: image
    image:
      url: ghcr.io/tashfeenahmed/freellmapi:latest
    plan: free
    healthCheckPath: /
    envVars:
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
